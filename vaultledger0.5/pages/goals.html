<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metas Financeiras - VaultLedger</title>
    <link rel="stylesheet" href="/src/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-background min-h-screen font-['Plus_Jakarta_Sans']">
    <main class="lg:ml-[240px] pt-24 px-6 lg:px-12 pb-12">
        <div class="flex items-center justify-between mb-10 animate-in fade-in duration-500">
            <div>
                <h1 class="text-3xl font-extrabold text-text-main">Metas Financeiras</h1>
                <p class="text-text-muted">Defina e acompanhe seus objetivos financeiros de longo prazo.</p>
            </div>
            <button id="openModal" class="btn-primary py-3 px-6 rounded-2xl flex items-center gap-2 shadow-xl shadow-primary/20">
                <i data-lucide="plus" class="w-5 h-5 text-gray-900"></i>
                <span class="text-gray-900 font-bold">Criar Meta</span>
            </button>
        </div>

        <div id="goalsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Goals will be injected here -->
        </div>
    </main>

    <!-- Modal -->
    <div id="goalModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-6 sm:p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-xl shadow-2xl overflow-hidden animate-in zoom-in duration-300">
            <div class="p-8 border-b border-border flex items-center justify-between">
                <h3 id="modalTitle" class="text-2xl font-extrabold text-text-main">Criar Nova Meta</h3>
                <button id="closeModal" class="p-2 text-text-muted hover:bg-gray-100 rounded-xl transition-all">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <form id="goalForm" class="p-8 space-y-6">
                <input type="hidden" name="id">
                <div>
                    <label class="block text-sm font-bold text-text-muted mb-2">Título da Meta</label>
                    <input type="text" name="title" class="input-field py-3" placeholder="Ex: Viagem para o Japão" required>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label id="targetLabel" class="block text-sm font-bold text-text-muted mb-2">Valor Alvo (R$)</label>
                        <input type="number" name="target" class="input-field py-3" placeholder="0,00" required>
                    </div>
                    <div>
                        <label id="currentLabel" class="block text-sm font-bold text-text-muted mb-2">Valor Atual (R$)</label>
                        <input type="number" name="current" class="input-field py-3" placeholder="0,00" value="0">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-text-muted mb-4">Cor da Meta</label>
                    <div class="flex gap-4">
                        <input type="radio" name="color" value="#EAB308" class="hidden peer/yellow" id="c-yellow" checked>
                        <label for="c-yellow" class="w-10 h-10 rounded-xl bg-yellow-500 cursor-pointer border-4 border-white shadow-sm ring-2 ring-transparent peer-checked/yellow:ring-gray-900 transition-all"></label>
                        
                        <input type="radio" name="color" value="#3B82F6" class="hidden peer/blue" id="c-blue">
                        <label for="c-blue" class="w-10 h-10 rounded-xl bg-blue-500 cursor-pointer border-4 border-white shadow-sm ring-2 ring-transparent peer-checked/blue:ring-gray-900 transition-all"></label>
                        
                        <input type="radio" name="color" value="#10B981" class="hidden peer/green" id="c-green">
                        <label for="c-green" class="w-10 h-10 rounded-xl bg-green-500 cursor-pointer border-4 border-white shadow-sm ring-2 ring-transparent peer-checked/green:ring-gray-900 transition-all"></label>
                        
                        <input type="radio" name="color" value="#A855F7" class="hidden peer/purple" id="c-purple">
                        <label for="c-purple" class="w-10 h-10 rounded-xl bg-purple-500 cursor-pointer border-4 border-white shadow-sm ring-2 ring-transparent peer-checked/purple:ring-gray-900 transition-all"></label>
                    </div>
                </div>
                <div class="pt-6 flex gap-4">
                    <button type="button" id="cancelBtn" class="flex-1 py-4 px-6 rounded-2xl border border-border text-text-muted font-bold hover:bg-gray-50 transition-all">Cancelar</button>
                    <button type="submit" id="submitBtn" class="flex-1 btn-primary py-4 px-6 rounded-2xl text-gray-900 font-bold shadow-xl shadow-primary/20">Criar Meta</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[110] hidden items-center justify-center p-6 sm:p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-sm shadow-2xl p-8 text-center animate-in zoom-in duration-300">
            <div class="w-20 h-20 bg-red-50 text-danger rounded-[2rem] flex items-center justify-center mx-auto mb-6">
                <i data-lucide="alert-triangle" class="w-10 h-10"></i>
            </div>
            <h3 class="text-2xl font-extrabold text-text-main mb-3">Excluir Meta?</h3>
            <p class="text-text-muted mb-8 text-sm leading-relaxed">Tem certeza que deseja excluir esta meta? Todo o progresso registrado será perdido.</p>
            <div class="flex gap-4">
                <button id="cancelDelete" class="flex-1 py-3 px-4 rounded-xl border border-border text-text-muted font-bold hover:bg-gray-50">Não</button>
                <button id="confirmDelete" class="flex-1 py-3 px-4 rounded-xl bg-danger text-white font-bold hover:bg-red-600 shadow-xl shadow-red-200">Sim, excluir</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initLayout, showToast } from '/js/layout.js';
        import { getGoals, createGoal, updateGoal, deleteGoal, getUserProfile, formatCurrency } from '/js/api.js';
        
        initLayout();
        
        const grid = document.getElementById('goalsGrid');
        const modal = document.getElementById('goalModal');
        const form = document.getElementById('goalForm');
        const deleteModal = document.getElementById('deleteModal');
        const targetLabel = document.getElementById('targetLabel');
        const currentLabel = document.getElementById('currentLabel');
        
        let editingId = null;
        let deletingId = null;
        let userCurrency = 'BRL';

        async function loadGoals() {
            try {
                const profile = await getUserProfile();
                userCurrency = profile.currency || 'BRL';
                
                const currencySymbols = { 'BRL': 'R$', 'USD': '$', 'EUR': '€' };
                const symbol = currencySymbols[userCurrency] || 'R$';
                
                targetLabel.textContent = `Valor Alvo (${symbol})`;
                currentLabel.textContent = `Valor Atual (${symbol})`;

                const goals = await getGoals();
                if (goals.length === 0) {
                    grid.innerHTML = '<div class="col-span-full py-20 text-center text-text-muted italic text-sm">Nenhuma meta criada ainda.</div>';
                } else {
                    grid.innerHTML = goals.map(g => {
                        const progress = Math.min((g.current / g.target) * 100, 100);
                        return `
                            <div class="bg-white p-8 rounded-[2rem] border border-border shadow-sm group hover:border-primary/50 transition-all duration-300 animate-in fade-in zoom-in duration-500">
                                <div class="flex items-center justify-between mb-6">
                                    <h3 class="font-bold text-xl text-text-main">${g.title}</h3>
                                    <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-all duration-200">
                                        <button onclick="window.editGoal(${g.id})" class="p-2 text-text-muted hover:text-primary-hover hover:bg-primary/10 rounded-xl transition-all">
                                            <i data-lucide="edit-3" class="w-4.5 h-4.5"></i>
                                        </button>
                                        <button onclick="window.confirmDelete(${g.id})" class="p-2 text-text-muted hover:text-danger hover:bg-red-50 rounded-xl transition-all">
                                            <i data-lucide="trash-2" class="w-4.5 h-4.5"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="flex items-end justify-between mb-4">
                                    <div>
                                        <p class="text-[10px] text-text-muted uppercase font-black tracking-widest mb-1">Guardado</p>
                                        <p class="text-2xl font-black text-text-main">${formatCurrency(g.current, userCurrency)}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-[10px] text-text-muted uppercase font-black tracking-widest mb-1">Alvo</p>
                                        <p class="text-sm font-bold text-text-muted">${formatCurrency(g.target, userCurrency)}</p>
                                    </div>
                                </div>
                                <div class="w-full h-3 bg-gray-100 rounded-full overflow-hidden shadow-inner">
                                    <div class="h-full transition-all duration-1000 ease-out rounded-full shadow-sm" style="width: ${progress}%; background-color: ${g.color}"></div>
                                </div>
                                <div class="flex justify-between items-center mt-3">
                                    <span class="text-[10px] font-black uppercase text-text-muted">${progress >= 100 ? 'Meta Atingida! 🎉' : 'A caminho...'}</span>
                                    <p class="text-sm font-black" style="color: ${g.color}">${Math.round(progress)}%</p>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
                lucide.createIcons();
            } catch (error) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-danger font-bold">Erro ao carregar metas.</div>';
            }
        }
        
        window.editGoal = async (id) => {
            const goals = await getGoals();
            const g = goals.find(item => item.id === id);
            if (!g) return;

            editingId = id;
            document.getElementById('modalTitle').textContent = 'Editar Meta';
            document.getElementById('submitBtn').textContent = 'Atualizar Meta';
            
            form.title.value = g.title;
            form.target.value = g.target;
            form.current.value = g.current;
            const radio = form.querySelector(`input[value="${g.color}"]`);
            if (radio) radio.checked = true;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            lucide.createIcons();
        };

        window.confirmDelete = (id) => {
            deletingId = id;
            deleteModal.classList.remove('hidden');
            deleteModal.classList.add('flex');
            lucide.createIcons();
        };

        document.getElementById('confirmDelete').addEventListener('click', async () => {
            if (!deletingId) return;
            try {
                await deleteGoal(deletingId);
                showToast('Meta excluída com sucesso');
                deletingId = null;
                deleteModal.classList.add('hidden');
                deleteModal.classList.remove('flex');
                loadGoals();
            } catch (error) {
                showToast('Erro ao excluir meta', 'error');
            }
        });

        document.getElementById('cancelDelete')?.addEventListener('click', () => {
            deleteModal.classList.add('hidden');
            deleteModal.classList.remove('flex');
            deletingId = null;
        });

        document.getElementById('openModal').addEventListener('click', () => {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Criar Nova Meta';
            document.getElementById('submitBtn').textContent = 'Criar Meta';
            form.reset();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            lucide.createIcons();
        });
        
        const close = () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            editingId = null;
        };
        
        document.getElementById('closeModal').addEventListener('click', close);
        document.getElementById('cancelBtn').addEventListener('click', close);
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.target = parseFloat(data.target);
            data.current = parseFloat(data.current);
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="animate-spin inline-block w-4 h-4 border-2 border-gray-900 border-t-transparent rounded-full mr-2"></span> Salvando...';

            try {
                if (editingId) {
                    await updateGoal(editingId, data);
                    showToast('Meta atualizada!');
                } else {
                    await createGoal(data);
                    showToast('Meta criada!');
                }
                close();
                loadGoals();
                form.reset();
            } catch (error) {
                showToast('Erro ao salvar meta', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = editingId ? 'Atualizar Meta' : 'Criar Meta';
            }
        });
        
        loadGoals();
    </script>
</body>
</html>
