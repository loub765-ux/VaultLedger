<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaultLedger Login</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: linear-gradient(135deg, #f5f5f5, #eaeaea);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Container principal */
.container {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

/* Logo */
.logo {
    margin-bottom: 30px;
}

.logo h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 1px;
}

.logo p {
    font-size: 13px;
    color: #777;
}

/* Card */
.card {
    background: #ffffff;
    padding: 40px 30px;
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
    text-align: left;
}

/* Título */
.card h2 {
    font-size: 24px;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 25px;
}

/* Labels */
.label {
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 6px;
    display: block;
}

/* Inputs */
.input-group {
    margin-bottom: 18px;
}

.input-wrapper {
    position: relative;
}

.input-wrapper input {
    width: 100%;
    padding: 14px 16px 14px 42px;
    border: none;
    border-radius: 999px;
    background: #f1f1f1;
    font-size: 14px;
    outline: none;
    transition: 0.2s;
}

.input-wrapper input:focus {
    background: #e7e7e7;
}

/* Ícones */
.icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: #9ca3af;
}

/* Linha senha */
.password-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.forgot {
    font-size: 12px;
    color: #bfa100;
    cursor: pointer;
}

/* Botão */
.button {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #facc15, #fde68a);
    font-weight: 700;
    font-size: 15px;
    color: #1f2937;
    cursor: pointer;
    transition: 0.2s;
}

.button:hover {
    filter: brightness(0.95);
}

/* Divider */
.divider {
    text-align: center;
    margin: 20px 0;
    font-size: 12px;
    color: #9ca3af;
}

/* Rodapé */
.footer {
    text-align: center;
    font-size: 13px;
    color: #6b7280;
}

.footer a {
    font-weight: 700;
    color: #111;
    text-decoration: none;
}

/* Badge */
.badge {
    margin-top: 20px;
    display: inline-block;
    padding: 8px 14px;
    font-size: 12px;
    border-radius: 999px;
    background: #e6f4f1;
    color: #0f766e;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>VAULTLEDGER</h1>
        <p>Controle seus gastos</p>
    </div>

    <div class="card">

        <h2>Bem vindo de volta!</h2>
        <p class="subtitle">Por favor entre suas credenciais para poder acessar sua conta.</p>

        <div class="input-group">
            <label class="label"> ENDEREÇO DE EMAIL</label>
            <div class="input-wrapper">
                <span class="icon">✉</span>
                <input type="email" placeholder="email@exemplo.com">
            </div>
        </div>

        <div class="input-group">
            <div class="password-row">
                <label class="label">SENHA</label>
                <span class="forgot">Esqueci minha senha</span>
            </div>
            <div class="input-wrapper">
                <span class="icon">🔒</span>
                <input type="password" placeholder="••••••••">
            </div>
        </div>

        <button class="button"><Em>Entrar</Em></button>

        <div class="divider">ou</div>

        <div class="footer">
            Usuário novo?
            <li><a href="register.html">Criar Conta</a></li>
        </div>

    </div>

    <div class="badge">
       Visual sujeito à alterações
    </div>

</div>

</body>
</html>
