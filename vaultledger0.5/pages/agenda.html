<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultLedger - Agenda</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f6f6f4;
    }

    .sidebar-item {
      transition: .3s;
    }

    .sidebar-item:hover {
      background: white;
    }

    .sidebar-active {
      box-shadow: 0 10px 25px -5px rgba(225, 185, 0, 0.4);
    }

    .card-shadow {
      box-shadow: 0 20px 40px rgba(0,0,0,.04);
    }

    .py-8 {
      overflow-y: scroll;
      overflow-x: hidden;
    }
    h1 { text-align: center; color: #333; }

    .calendar-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
      font-size: 1.4em;
      font-weight: bold;
    }
    .calendar-header button {
      padding:  10px;
      width: 60px;
      font-size: 1em;
      background: #f4c400;
      box-shadow: 0 10px 25px -5px rgb(225, 184, 0);
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 10px;
      border-radius: 24px;
      border: 1px solid #ecece8;
    }
    .day-header {
      text-align: center;
      font-weight: bold;
      padding: 10px;
      background: #e0e7ff;
      border-radius: 6px;
    }
    .day {
      height: 130px;
      border: 1px solid #ddd;
      padding: 6px;
      overflow-y: auto;
      font-size: 0.85em;
      border-radius: 6px;
    }
    .today-highlight {
      border: 2px solid #f4c400 !important;
      background: #fffdf2;
      box-shadow: 0 0 20px rgba(244, 196, 0, 0.4);
      position: relative;
      z-index: 10;
    }
    .day-name {
      font-weight: bold;
      margin-bottom: 6px;
      text-align: center;
    }
    .appointment {
      padding: 5px 7px;
      margin: 4px 0;
      border-radius: 5px;
      color: white;
      font-size: 0.8em;
      cursor: pointer;
    }
    .variavel { background: #22c55e; }
    .fixo { background: #3b82f6; }

    .form-container {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 24px;
      border: 1px solid #ecece8;
    }
    input, textarea, select, button {
      padding: 10px;
      margin: 8px 0;
      width: 100%;
      border-radius: 12px;
      border: 1px solid #ecece8;
      outline: none;
    }
    #addBtn {
      background: #f4c400;
      color: black;
      font-weight: 800;
      cursor: pointer;
      font-size: 1.1em;
      border: none;
      transition: 0.3s;
    }
    #addBtn:hover { background: #e1b900; }

    .list {
      max-width: 1000px;
      margin: 30px auto;
    }
    .appointment-item {
      padding: 15px;
      margin: 10px 0;
      background: white;
      border-radius: 16px;
      border-left: 6px solid;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-[290px] bg-[#f2f2f0] border-r border-[#e8e8e5] fixed h-screen px-6 py-8 flex flex-col justify-between shadow-2xl z-20">
        <div>
            <img src="vaultledger_logo.png" alt="VaultLedger Logo" class="h-24 w-auto object-contain mb-6">
            <nav class="mt-16 flex flex-col gap-3">
                <a href="dashboard.html" class="sidebar-item flex items-center gap-3 px-4 py-4 rounded-2xl text-gray-600 hover:bg-white transition">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>

                <a href="transactions.html" class="sidebar-item flex items-center gap-3 px-4 py-4 rounded-2xl text-gray-600 hover:bg-white transition">
                    <i data-lucide="receipt"></i>
                    <span>Transações</span>
                </a>

                <a href="goals.html" class="sidebar-item flex items-center gap-3 px-4 py-4 rounded-2xl text-gray-600 hover:bg-white transition">
                    <i data-lucide="target"></i>
                    <span>Metas</span>
                </a>

                <a href="agenda.html" class="sidebar-item flex items-center justify-between px-4 py-4 rounded-2xl bg-[#efe5a7] text-black font-bold sidebar-active">
                    <div class="flex items-center gap-3">
                        <i data-lucide="calendar-days"></i>
                        <span>Agenda</span>
                    </div>
                    <div class="w-1 h-8 bg-[#e1b900] rounded-full"></div>
                </a>

                <a href="categories.html" class="sidebar-item flex items-center gap-3 px-4 py-4 rounded-2xl text-gray-600 hover:bg-white transition">
                    <i data-lucide="layers-3"></i>
                    <span>Categorias</span>
                </a>

                <a href="settings.html" class="sidebar-item flex items-center gap-3 px-4 py-4 rounded-2xl text-gray-600 hover:bg-white transition">
                    <i data-lucide="settings"></i>
                    <span>Opções</span>
                </a>

                <a href="calculadora.html" class="sidebar-item flex items-center gap-3 px-4 py-4 rounded-2xl text-gray-600 hover:bg-white transition">
                    <i data-lucide="calculator"></i>
                    <span>Calculadora</span>
                </a>
            </nav>
        </div>

        <button id="logoutBtn" class="sidebar-item flex items-center gap-3 px-4 py-4 rounded-2xl text-gray-600 hover:text-black transition">
                <div class="flex items-center gap-3">
                    <i data-lucide="log-out"></i>
                    <span>Sair</span>
                </div>
        </button>
    </aside>

    <!-- MAIN -->
    <main class="ml-[290px] w-full px-10 py-8">

        <!-- TOP -->
        <div class="mb-12">
            <p class="text-gray-400 mb-2 font-medium">
                Pages / Agenda
            </p>
            <h1 class="text-5xl font-black tracking-tight">
                Calendário Financeiro
            </h1>
            <p class="text-gray-500 mt-4 text-lg">
                Visualize seus compromissos e agendamentos de pagamentos.
            </p>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-[1fr_350px] gap-10">
            <div>
                <!-- Navegação do Calendário -->
                <div class="calendar-header mb-6">
                    <button onclick="mudarMes(-1)">←</button>
                    <span id="mes-atual"></span>
                    <button onclick="mudarMes(1)">→</button>
                </div>

                <!-- Calendário -->
                <div id="calendar" class="calendar card-shadow mb-10"></div>

                <!-- Lista de Agendamentos -->
                <div class="list">
                    <h2 class="text-2xl font-black mb-6">📋 Todos os Agendamentos</h2>
                    <div id="lista-agendamentos"></div>
                </div>
            </div>

            <!-- Formulário Lateral -->
            <div class="form-container sticky top-8 h-fit card-shadow">
                <h2 class="text-2xl font-black mb-4">Novo Agendamento</h2>
                <label class="text-xs font-bold uppercase text-gray-400">Título</label>
                <input type="text" id="nome" placeholder="Nome do pagamento" required>
                
                <label class="text-xs font-bold uppercase text-gray-400">Valor (R$)</label>
                <input type="number" id="valor" placeholder="0.00" step="0.01" required>
                
                <label class="text-xs font-bold uppercase text-gray-400">Data</label>
                <input type="date" id="data" required>
                
                <label class="text-xs font-bold uppercase text-gray-400">Tipo</label>
                <select id="tipo">
                    <option value="variavel">Variável (Verde)</option>
                    <option value="fixo">Fixo (Azul)</option>
                </select>
                
                <label class="text-xs font-bold uppercase text-gray-400">Descrição</label>
                <textarea id="descricao" rows="3" placeholder="Opcional"></textarea>
                <button id="addBtn" onclick="adicionarAgendamento()">Adicionar à Agenda</button>
            </div>
        </div>
    </main>
</div>

  <script>
    lucide.createIcons();
    let agendamentos = JSON.parse(localStorage.getItem('agendamentos')) || [];
    let dataAtual = new Date();

    function salvarAgendamentos() {
      localStorage.setItem('agendamentos', JSON.stringify(agendamentos));
    }

    function formatarMesAno() {
      const options = { month: 'long', year: 'numeric' };
      document.getElementById('mes-atual').textContent = 
        dataAtual.toLocaleDateString('pt-BR', options);
    }

    function adicionarAgendamento() {
      const nome = document.getElementById('nome').value;
      const valor = parseFloat(document.getElementById('valor').value);
      const data = document.getElementById('data').value;
      const tipo = document.getElementById('tipo').value;
      const descricao = document.getElementById('descricao').value;

      if (!nome || !valor || !data) {
        alert("Preencha nome, valor e data!");
        return;
      }

      agendamentos.push({
        id: Date.now(),
        nome: nome,
        valor: valor,
        data: data,
        tipo: tipo,
        descricao: descricao
      });

      salvarAgendamentos();
      renderizarTudo();
      
      // Limpar formulário
      document.getElementById('nome').value = '';
      document.getElementById('valor').value = '';
      document.getElementById('data').value = '';
      document.getElementById('descricao').value = '';
    }

    function removerAgendamento(id) {
      if (confirm('Deseja realmente excluir este agendamento?')) {
        agendamentos = agendamentos.filter(a => a.id !== id);
        salvarAgendamentos();
        renderizarTudo();
      }
    }

    function mudarMes(direcao) {
      dataAtual.setDate(1);
      dataAtual.setMonth(dataAtual.getMonth() + direcao);
      renderizarTudo();
    }

    function renderizarCalendario() {
      const calendar = document.getElementById('calendar');
      calendar.innerHTML = '';

      const dias = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      dias.forEach(dia => {
        const header = document.createElement('div');
        header.className = 'day-header';
        header.textContent = dia;
        calendar.appendChild(header);
      });

      const ano = dataAtual.getFullYear();
      const mes = dataAtual.getMonth();

      const hoje = new Date();
      const eHojeMesAno = hoje.getFullYear() === ano && hoje.getMonth() === mes;

      const primeiroDia = new Date(ano, mes, 1).getDay();
      const ultimoDia = new Date(ano, mes + 1, 0).getDate();

      // Dias vazios
      for (let i = 0; i < primeiroDia; i++) {
        const vazio = document.createElement('div');
        vazio.className = 'day';
        calendar.appendChild(vazio);
      }

      // Dias do mês
      for (let dia = 1; dia <= ultimoDia; dia++) {
        const dataStr = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
        
        const dayEl = document.createElement('div');
        dayEl.className = 'day';
        
        if (eHojeMesAno && hoje.getDate() === dia) {
          dayEl.classList.add('today-highlight');
        }
        
        const dayName = document.createElement('div');
        dayName.className = 'day-name';
        dayName.textContent = dia;
        dayEl.appendChild(dayName);

        const agendamentosDoDia = agendamentos.filter(a => a.data === dataStr);
        
        agendamentosDoDia.forEach(ag => {
          const el = document.createElement('div');
          el.className = `appointment ${ag.tipo} hover:brightness-90 transition-all`;
          el.onclick = () => removerAgendamento(ag.id);
          el.title = "Clique para remover este agendamento";
          el.innerHTML = `
            <strong>${ag.nome}</strong><br>
            R$ ${ag.valor.toFixed(2)}
          `;
          dayEl.appendChild(el);
        });

        calendar.appendChild(dayEl);
      }
    }

    function renderizarLista() {
      const lista = document.getElementById('lista-agendamentos');
      lista.innerHTML = '';

      agendamentos.sort((a,b) => a.data.localeCompare(b.data));

      agendamentos.forEach(ag => {
        const div = document.createElement('div');
        div.className = 'appointment-item items-center';
        div.style.borderLeftColor = ag.tipo === 'variavel' ? '#22c55e' : '#3b82f6';

        // Formata a data para o padrão brasileiro (DD/MM/AAAA)
        const [ano, mes, dia] = ag.data.split('-');
        const dataFormatada = `${dia}/${mes}/${ano}`;
        
        div.innerHTML = `
          <div class="flex-1">
            <strong>${ag.nome}</strong><br>
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">${dataFormatada}</span><br>
            ${ag.descricao ? `<p class="text-xs text-gray-500 mt-1 italic">${ag.descricao}</p>` : ''}
          </div>
          <div class="text-right px-6">
            <strong>R$ ${ag.valor.toFixed(2)}</strong><br>
            <span class="text-[10px] uppercase font-black tracking-widest" style="color: ${ag.tipo === 'variavel' ? '#22c55e' : '#3b82f6'};">
              ${ag.tipo === 'variavel' ? 'Variável' : 'Fixo'}
            </span>
          </div>
          <button onclick="removerAgendamento(${ag.id})" class="flex-none self-center w-10 h-10 flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all">
            <i data-lucide="trash-2" class="w-5 h-5"></i>
          </button>
        `;
        lista.appendChild(div);
      });
      lucide.createIcons();
    }

    function renderizarTudo() {
      formatarMesAno();
      renderizarCalendario();
      renderizarLista();
    }

    // Inicializar
    renderizarTudo();
  </script>

</body>
</html>
