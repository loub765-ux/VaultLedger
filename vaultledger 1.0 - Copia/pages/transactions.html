/* === Notification Bell === */
.vl-notif-wrap { position: relative; }
.vl-notif-btn {
  width: 48px; height: 48px; border-radius: 16px;
  border: 1px solid #ecece8; background: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .2s; position: relative;
}
.dark .vl-notif-btn { background: #242424; border-color: #3a3a3a; color: #f5f5f5; }
.vl-notif-btn:hover { background: #fafafa; transform: scale(1.05); }
.dark .vl-notif-btn:hover { background: #2a2a2a; }
.vl-notif-badge {
  position: absolute; top: -4px; right: -4px;
  min-width: 20px; height: 20px; padding: 0 5px;
  background: #ef4444; color: #fff; font-size: 11px; font-weight: 800;
  border-radius: 999px; display: none; align-items: center; justify-content: center;
  border: 2px solid #fff;
}
.dark .vl-notif-badge { border-color: #242424; }
.vl-notif-badge.show { display: flex; }
.vl-notif-panel {
  position: absolute; top: calc(100% + 10px); right: 0;
  width: 360px; max-width: calc(100vw - 32px);
  background: #fff; border: 1px solid #ecece8; border-radius: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,.12);
  z-index: 100; display: none; overflow: hidden;
}
.dark .vl-notif-panel { background: #242424; border-color: #3a3a3a; }
.vl-notif-panel.open { display: block; }
.vl-notif-header {
  padding: 16px 18px; border-bottom: 1px solid #ecece8;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.dark .vl-notif-header { border-color: #3a3a3a; }
.vl-notif-list { max-height: 320px; overflow-y: auto; }
.vl-notif-item {
  padding: 14px 18px; border-bottom: 1px solid #f3f4f6;
  display: flex; gap: 12px; align-items: flex-start;
}
.dark .vl-notif-item { border-color: #2a2a2a; }
.vl-notif-item:last-child { border-bottom: none; }
.vl-notif-empty { padding: 28px 18px; text-align: center; color: #8a8a8a; font-size: 14px; }
.vl-notif-dot {
  width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
}
.vl-notif-dot.today { background: #ef4444; }
.vl-notif-dot.tomorrow { background: #f4c400; }
.vl-notif-sys-btn {
  font-size: 12px; font-weight: 700; color: #b45309;
  background: #fef9e7; border: none; border-radius: 10px;
  padding: 6px 10px; cursor: pointer; white-space: nowrap;
}
.dark .vl-notif-sys-btn { background: rgba(244,196,0,.15); color: #f4c400; }

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Indie+Flower&family=Federo&family=IBM+Plex+Serif:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  try {
    var s = JSON.parse(localStorage.getItem('vaultledger_settings') || '{}');
    var FONT_MAP = {
      roboto: "'Roboto', 'Plus Jakarta Sans', sans-serif",
      indie: "'Indie Flower', cursive",
      federo: "'Federo', sans-serif",
      ibm: "'IBM Plex Serif', serif"
    };
    var bg = s.background || 'white';
    var font = s.font || 'roboto';
    document.documentElement.style.setProperty('--vl-font', FONT_MAP[font] || FONT_MAP.roboto);
    document.documentElement.classList.remove('dark', 'theme-blue');
    function applyBody() {
      if (!document.body) return;
      document.body.style.fontFamily = FONT_MAP[font] || FONT_MAP.roboto;
      if (bg === 'black') {
        document.documentElement.classList.add('dark');
        document.body.style.background = '#0a0a0a';
        document.body.style.color = '#f5f5f5';
      } else if (bg === 'blue') {
        document.documentElement.classList.add('theme-blue');
        document.body.style.background = '#00152C';
        document.body.style.color = '#E8F1FF';
      } else {
        document.body.style.background = '';
        document.body.style.color = '';
      }
    }
    if (document.body) applyBody();
    else document.addEventListener('DOMContentLoaded', applyBody);
    window.VL_CURRENCY = s.currency || 'BRL';
    window.VL_formatMoney = function(v, full) {
      var cur = window.VL_CURRENCY || 'BRL';
      var locale = cur === 'BRL' ? 'pt-BR' : cur === 'EUR' ? 'de-DE' : cur === 'GBP' ? 'en-GB' : cur === 'JPY' ? 'ja-JP' : 'en-US';
      return Number(v||0).toLocaleString(locale, {
        style: 'currency', currency: cur,
        minimumFractionDigits: full ? 2 : 0,
        maximumFractionDigits: full ? 2 : 0
      });
    };
  } catch(e) {}
})();
</script>

    <script>
        lucide.createIcons();
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [
            { id: 1, date: "2026-07-18", type: "Fixo", category: "Aluguel", description: "Pagamento mensal do escritório", value: 4500.00 },
            { id: 2, date: "2026-07-17", type: "Variável", category: "Alimentação", description: "Almoço com equipe", value: -85.50 },
            { id: 3, date: "2026-07-15", type: "Fixo", category: "Salário", description: "Pagamento de folha", value: 12500.00 },
            { id: 4, date: "2026-07-14", type: "Variável", category: "Transporte", description: "Uber para reunião", value: -45.00 },
            { id: 5, date: "2026-07-12", type: "Fixo", category: "Utilidades", description: "Conta de energia", value: 320.75 },
            { id: 6, date: "2026-07-10", type: "Variável", category: "Alimentação", description: "Jantar com cliente", value: -180.00 },
            { id: 7, date: "2026-07-08", type: "Fixo", category: "Aluguel", description: "Próximo mês", value: 4500.00 }
        ];
        
        let currentPage = 1;
        const itemsPerPage = 5;
        let filteredTransactions = [];

        function filterTransactions() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const dateFilter = document.getElementById('dateFilter').value;
            const categoryFilter = document.getElementById('categoryFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            const valueFilter = parseFloat(document.getElementById('valueFilter').value);

            filteredTransactions = transactions.filter(transaction => {
                const matchesSearch = !searchTerm || 
                    transaction.description.toLowerCase().includes(searchTerm) ||
                    transaction.category.toLowerCase().includes(searchTerm);
                
                const matchesDate = !dateFilter || transaction.date === dateFilter;
                const matchesCategory = !categoryFilter || transaction.category === categoryFilter;
                const matchesType = !typeFilter || transaction.type === typeFilter;
                const matchesValue = isNaN(valueFilter) || Math.abs(transaction.value) >= valueFilter;

                return matchesSearch && matchesDate && matchesCategory && matchesType && matchesValue;
            });
        }

        function renderTable() {
            const tbody = document.getElementById('transactionsTable');
            tbody.innerHTML = '';

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredTransactions.slice(start, end);

            if (pageItems.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-8 py-16 text-center text-text-muted">
                            Nenhuma transação encontrada
                        </td>
                    </tr>
                `;
                return;
            }

            pageItems.forEach(transaction => {
                const row = document.createElement('tr');
                row.className = 'table-row dark:hover:bg-dark-background';
                const valueClass = transaction.value >= 0 ? 'amount-positive' : 'amount-negative';
                const valueSign = transaction.value >= 0 ? '+' : '';
                
                row.innerHTML = `
                    <td class="px-8 py-5 text-text-main dark:text-dark-text-main font-medium">${formatDate(transaction.date)}</td>
                    <td class="px-6 py-5">
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium ${transaction.type === 'Fixo' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                            ${transaction.type}
                        </span>
                    </td>
                    <td class="px-6 py-5 text-text-main dark:text-dark-text-main">${transaction.category}</td>
                    <td class="px-6 py-5 text-text-muted">${transaction.description}</td>
                    <td class="px-6 py-5 text-right font-semibold ${valueClass}">
                        ${valueSign} ${(typeof VL_formatMoney==='function'?VL_formatMoney(Math.abs(transaction.value),true):( 'R$ '+Math.abs(transaction.value).toLocaleString('pt-BR',{minimumFractionDigits:2})))}
                    </td>
                    <td class="px-6 py-5 text-right">
                        <button onclick="deleteTransaction(${transaction.id});" 
                                class="text-red-400 hover:text-red-600 transition-colors p-2">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredTransactions.length / itemsPerPage) || 1;
            const paginationContainer = document.getElementById('paginationControls');
            paginationContainer.innerHTML = '';

            const prevBtn = document.createElement('button');
            prevBtn.className = `pagination-btn w-9 h-9 flex items-center justify-center border border-border dark:border-dark-border rounded-xl ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100 dark:hover:bg-dark-background'}`;
            prevBtn.innerHTML = `<i data-lucide="chevron-left" class="w-4 h-4"></i>`;
            prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; updateUI(); } };
            paginationContainer.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `pagination-btn w-9 h-9 flex items-center justify-center border border-border dark:border-dark-border rounded-xl ${i === currentPage ? 'active' : 'hover:bg-gray-100 dark:hover:bg-dark-background'}`;
                pageBtn.textContent = i;
                pageBtn.onclick = () => { currentPage = i; updateUI(); };
                paginationContainer.appendChild(pageBtn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = `pagination-btn w-9 h-9 flex items-center justify-center border border-gray-200 rounded-xl ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100'}`;
            nextBtn.className = `pagination-btn w-9 h-9 flex items-center justify-center border border-border dark:border-dark-border rounded-xl ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100 dark:hover:bg-dark-background'}`;
            nextBtn.innerHTML = `<i data-lucide="chevron-right" class="w-4 h-4"></i>`;
            nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; updateUI(); } };
            paginationContainer.appendChild(nextBtn);

            document.getElementById('pageInfo').textContent = 
                `Página ${currentPage} de ${totalPages} • ${filteredTransactions.length} transações`;
        }

        function updateUI() {
            renderTable();
            renderPagination();
            lucide.createIcons();
        }

        function applyFiltersAndPagination() {
            currentPage = 1;
            filterTransactions();
            updateUI();
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('pt-BR');
        }

        function saveTransaction(e) {
            e.preventDefault();
            
            const type = document.getElementById('transactionType').value;
            const nature = document.getElementById('transactionNature').value;
            let value = parseFloat(document.getElementById('transactionValue').value);
            const date = document.getElementById('transactionDate').value;
            const category = document.getElementById('transactionCategory').value;
            const description = document.getElementById('transactionDescription').value;
            
            if (!type || !nature || isNaN(value) || !date || !category || !description) {
                alert("Por favor, preencha todos os campos.");
                return;
            }
            
            if (nature === "negative") value = -Math.abs(value);
            else value = Math.abs(value);
            
            const newTransaction = {
                id: Date.now(),
                date: date,
                type: type,
                category: category,
                description: description,
                value: value
            };
            
            transactions.unshift(newTransaction);
            localStorage.setItem('transactions', JSON.stringify(transactions));
            
            closeModal();
            applyFiltersAndPagination();
            
            const notification = document.createElement('div');
            notification.className = 'fixed bottom-6 right-6 bg-green-600 text-white px-6 py-3 rounded-2xl shadow-lg flex items-center gap-2 z-50';
            notification.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i> Transação adicionada com sucesso!`;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 2200);
        }

        function deleteTransaction(id) {
            if (confirm('Tem certeza que deseja excluir esta transação?')) {
                transactions = transactions.filter(t => t.id !== id);
                localStorage.setItem('transactions', JSON.stringify(transactions));
                applyFiltersAndPagination();
            }
        }

        function openNewTransactionModal() {
            document.getElementById('transactionModal').classList.remove('hidden');
            document.getElementById('transactionForm').reset();
            document.getElementById('transactionType').value = '';
            document.getElementById('transactionNature').value = '';
            
            document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('border-yellow-400', 'bg-yellow-50'));
            document.querySelectorAll('.nature-btn').forEach(btn => {
                btn.classList.remove('border-emerald-400', 'bg-emerald-50', 'border-red-400', 'bg-red-50');
            });
            lucide.createIcons();
        }
        
        function closeModal() {
            document.getElementById('transactionModal').classList.add('hidden');
        }
        
        function selectType(el) {
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.remove('border-yellow-400', 'bg-yellow-50');
            });
            el.classList.add('border-yellow-400', 'bg-yellow-50');
            document.getElementById('transactionType').value = el.dataset.type;
        }

        function selectNature(el) {
            document.querySelectorAll('.nature-btn').forEach(btn => {
                btn.classList.remove('border-emerald-400', 'bg-emerald-50', 'border-red-400', 'bg-red-50');
            });
            
            if (el.dataset.nature === "positive") {
                el.classList.add('border-emerald-400', 'bg-emerald-50');
            } else {
                el.classList.add('border-red-400', 'bg-red-50');
            }
            
            document.getElementById('transactionNature').value = el.dataset.nature;
        }
        
        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('dateFilter').value = '';
            document.getElementById('categoryFilter').value = '';
            document.getElementById('typeFilter').value = '';
            document.getElementById('valueFilter').value = '';
            applyFiltersAndPagination();
        }

        // Initialize
        window.onload = function() {
            applyFiltersAndPagination();
        };
    </script>

<script>
(function() {
  function pad(n){ return String(n).padStart(2,'0'); }
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function tomorrowStr() {
    const d = new Date();
    d.setDate(d.getDate()+1);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function formatBR(iso) {
    if (!iso) return '';
    const p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function formatMoney(v) {
    return Number(v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  }
  function protocolBlocked() {
    return location.protocol === 'file:';
  }

  function getDueAgendamentos() {
    let list = [];
    try { list = JSON.parse(localStorage.getItem('agendamentos')) || []; } catch(e) {}
    const t = todayStr();
    const tm = tomorrowStr();
    return list
      .filter(a => a && (a.data === t || a.data === tm))
      .map(a => ({
        ...a,
        when: a.data === t ? 'today' : 'tomorrow',
        label: a.data === t ? 'Hoje' : 'Amanhã'
      }))
      .sort((a,b) => String(a.data).localeCompare(String(b.data)));
  }

  function renderNotifUI() {
    const items = getDueAgendamentos();
    const badge = document.getElementById('vlNotifBadge');
    const list = document.getElementById('vlNotifList');
    if (!badge || !list) return;

    if (items.length === 0) {
      badge.classList.remove('show');
      badge.textContent = '0';
      list.innerHTML = '<div class="vl-notif-empty">Nenhum agendamento para hoje ou amanhã.</div>';
    } else {
      badge.classList.add('show');
      badge.textContent = String(items.length);
      list.innerHTML = items.map(a => {
        const nome = String(a.nome || 'Agendamento').replace(/</g,'&lt;');
        const desc = a.descricao ? '<p class="text-xs text-text-muted mt-1 truncate">' + String(a.descricao).replace(/</g,'&lt;') + '</p>' : '';
        return '<div class="vl-notif-item">' +
          '<div class="vl-notif-dot ' + a.when + '"></div>' +
          '<div class="min-w-0 flex-1">' +
            '<p class="font-bold text-sm text-text-main dark:text-dark-text-main truncate">' + nome + '</p>' +
            '<p class="text-xs text-text-muted mt-0.5">' + a.label + ' · ' + formatBR(a.data) + ' · ' + formatMoney(a.valor) + '</p>' +
            desc +
          '</div>' +
          '<span class="text-[10px] font-black uppercase tracking-wider ' + (a.when==='today'?'text-red-500':'text-yellow-600') + '">' + a.label + '</span>' +
        '</div>';
      }).join('');
    }
  }

  function showToast(msg, isError) {
    let t = document.getElementById('vlNotifToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'vlNotifToast';
      t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;padding:14px 22px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:90vw;text-align:center;transition:opacity .3s;pointer-events:none;';
      document.body.appendChild(t);
    }
    t.style.background = isError ? '#991b1b' : '#111827';
    t.style.color = '#fff';
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.style.opacity = '0'; }, 4500);
  }

  function fireNotification(title, body, tag) {
    try {
      const n = new Notification(title, {
        body: body,
        tag: tag || ('vl-' + Date.now()),
        icon: 'vaultledger_logo.png',
        badge: 'vaultledger_logo.png',
        requireInteraction: false
      });
      n.onclick = function() {
        window.focus();
        n.close();
        try { location.href = 'agenda.html'; } catch(e) {}
      };
      return true;
    } catch (err) {
      console.error('Notification error:', err);
      return false;
    }
  }

  function sendDueNotifications(silent) {
    if (protocolBlocked()) {
      if (!silent) showToast('Abra o site via localhost (Live Server) para notificações no PC.', true);
      return 0;
    }
    if (!('Notification' in window) || Notification.permission !== 'granted') return 0;

    const items = getDueAgendamentos();
    if (!items.length) return 0;

    // Evita spam: só uma vez por dia por agendamento
    const dayKey = 'vl_auto_notif_' + todayStr();
    let sentMap = {};
    try { sentMap = JSON.parse(localStorage.getItem(dayKey) || '{}'); } catch(e) {}

    let ok = 0;
    items.forEach(function(a) {
      const id = String(a.id);
      if (sentMap[id]) return;
      const title = (a.when === 'today' ? 'Agendamento HOJE: ' : 'Agendamento AMANHÃ: ') + (a.nome || 'Pagamento');
      const body = formatBR(a.data) + ' · ' + formatMoney(a.valor) + (a.descricao ? '\n' + a.descricao : '');
      if (fireNotification(title, body, 'vl-agenda-' + id)) {
        sentMap[id] = 1;
        ok++;
      }
    });

    try { localStorage.setItem(dayKey, JSON.stringify(sentMap)); } catch(e) {}
    return ok;
  }

  async function ensurePermissionAndNotify() {
    if (protocolBlocked()) {
      // Só avisa uma vez por sessão
      if (!sessionStorage.getItem('vl_file_warn')) {
        sessionStorage.setItem('vl_file_warn', '1');
        // não spammar toast em file://
      }
      renderNotifUI();
      return;
    }

    if (!('Notification' in window)) {
      renderNotifUI();
      return;
    }

    let permission = Notification.permission;

    // Primeira visita: pedir permissão automaticamente
    if (permission === 'default') {
      try {
        permission = await Notification.requestPermission();
      } catch (e) {
        console.warn('requestPermission failed', e);
      }
    }

    if (permission === 'granted') {
      const n = sendDueNotifications(true);
      if (n > 0 && !sessionStorage.getItem('vl_toast_sent_' + todayStr())) {
        sessionStorage.setItem('vl_toast_sent_' + todayStr(), '1');
        showToast(n + ' agendamento(s) notificado(s) no sistema.');
      }
    }

    renderNotifUI();
  }

  // Botão manual ainda funciona (reenvia / força)
  async function sendSystemNotificationsManual() {
    if (protocolBlocked()) {
      showToast('Notificações do PC não funcionam em file://. Use Live Server (localhost).', true);
      return;
    }
    if (!('Notification' in window)) {
      showToast('Navegador sem suporte a notificações.', true);
      return;
    }

    let permission = Notification.permission;
    if (permission === 'default') {
      try { permission = await Notification.requestPermission(); } catch(e) {}
    }
    if (permission !== 'granted') {
      showToast('Permissão negada. Ative no cadeado da barra de endereço.', true);
      return;
    }

    // Limpa mapa do dia para permitir reenvio manual
    try { localStorage.removeItem('vl_auto_notif_' + todayStr()); } catch(e) {}
    const n = sendDueNotifications(false);
    if (n > 0) showToast(n + ' notificação(ões) enviada(s).');
    else {
      const items = getDueAgendamentos();
      if (!items.length) showToast('Nenhum agendamento para hoje ou amanhã.');
      else showToast('Notificações já tinham sido enviadas hoje. Reenviado se necessário.');
      // force fire anyway on manual
      items.forEach(function(a) {
        const title = (a.when === 'today' ? 'Agendamento HOJE: ' : 'Agendamento AMANHÃ: ') + (a.nome || 'Pagamento');
        const body = formatBR(a.data) + ' · ' + formatMoney(a.valor);
        fireNotification(title, body, 'vl-agenda-manual-' + a.id + '-' + Date.now());
      });
      if (items.length) showToast(items.length + ' notificação(ões) reenviada(s).');
    }
  }

  function initBell() {
    const btn = document.getElementById('vlNotifBtn');
    const panel = document.getElementById('vlNotifPanel');
    const sysBtn = document.getElementById('vlNotifSysBtn');
    if (!btn || !panel) return;

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      panel.classList.toggle('open');
      renderNotifUI();
      if (window.lucide) try { lucide.createIcons(); } catch(e) {}
    });
    document.addEventListener('click', function(e) {
      if (!panel.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
        panel.classList.remove('open');
      }
    });
    if (sysBtn) {
      sysBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        sendSystemNotificationsManual();
      });
    }

    renderNotifUI();

    // Pedir permissão + notificar automaticamente ao entrar
    setTimeout(function() {
      ensurePermissionAndNotify();
    }, 600);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initBell);
  } else {
    initBell();
  }
})();
</script>

(function(){
  if (typeof window.VL_formatMoney === 'function') {
    window.formatMoney = function(v){ return window.VL_formatMoney(v, false); };
    window.formatMoneyFull = function(v){ return window.VL_formatMoney(v, true); };
  }
})();
</script>
