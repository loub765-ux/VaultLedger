/* === Notification Bell === */
.vl-notif-wrap { position: relative; }

.vl-notif-panel {
  position: absolute; top: calc(100% + 10px); right: 0;
  width: 360px; max-width: calc(100vw - 32px);

.dark .vl-notif-header { border-color: #3a3a3a; }

.dark .vl-notif-item { border-color: #2a2a2a; }
.vl-notif-item:last-child { border-bottom: none; }
.vl-notif-empty { padding: 28px 18px; text-align: center; color: #8a8a8a; font-size: 14px; }
.vl-notif-dot {

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Indie+Flower&family=Federo&family=IBM+Plex+Serif:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  try {
    var s = JSON.parse(localStorage.getItem('vaultledger_settings') || '{}');
    var FONT_MAP = {
      roboto: "'Roboto', 'Plus Jakarta Sans', sans-serif",
      indie: "'Indie Flower', cursive",
      federo: "'Federo', sans-serif",
      ibm: "'IBM Plex Serif', serif"
    };
    var bg = s.background || 'white';
    var font = s.font || 'roboto';
    document.documentElement.style.setProperty('--vl-font', FONT_MAP[font] || FONT_MAP.roboto);
    document.documentElement.classList.remove('dark', 'theme-blue');
    function applyBody() {
      if (!document.body) return;
      document.body.style.fontFamily = FONT_MAP[font] || FONT_MAP.roboto;
      if (bg === 'black') {
        document.documentElement.classList.add('dark');
        document.body.style.background = '#0a0a0a';
        document.body.style.color = '#f5f5f5';
      } else if (bg === 'blue') {
        document.documentElement.classList.add('theme-blue');
        document.body.style.background = '#00152C';
        document.body.style.color = '#E8F1FF';
      } else {
        document.body.style.background = '';
        document.body.style.color = '';
      }
    }
    if (document.body) applyBody();
    else document.addEventListener('DOMContentLoaded', applyBody);
    window.VL_CURRENCY = s.currency || 'BRL';
    window.VL_formatMoney = function(v, full) {
      var cur = window.VL_CURRENCY || 'BRL';
      var locale = cur === 'BRL' ? 'pt-BR' : cur === 'EUR' ? 'de-DE' : cur === 'GBP' ? 'en-GB' : cur === 'JPY' ? 'ja-JP' : 'en-US';
      return Number(v||0).toLocaleString(locale, {
        style: 'currency', currency: cur,
        minimumFractionDigits: full ? 2 : 0,
        maximumFractionDigits: full ? 2 : 0
      });
    };
  } catch(e) {}
})();
</script>

            </div>
            <div class="flex gap-3">
                <button type="button" onclick="closeCreateModal()" class="flex-1 py-3.5 rounded-xl border border-border dark:border-dark-border font-semibold hover:bg-gray-50 dark:hover:bg-dark-background transition">
                    Cancelar
                </button>
                <button type="submit" class="flex-1 py-3.5 rounded-xl bg-primary hover:bg-primary-hover font-bold transition shadow-md shadow-yellow-200/50">
                    Criar Meta
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Adicionar Valor -->
<div class="modal-overlay" id="addModal">
    <div class="modal">
        <h2 class="text-2xl font-black mb-6">Adicionar Valor</h2>
        <form id="addForm" onsubmit="handleAddValue(event)">
            <input type="hidden" id="addGoalId">
            <div class="mb-4">
                <label class="block text-sm font-semibold mb-1.5">Meta</label>
                <input type="text" id="addGoalName" readonly
                    class="w-full px-4 py-3 rounded-xl border border-border dark:border-dark-border bg-gray-100 dark:bg-dark-background cursor-default">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold mb-1.5" for="addAmount">Valor a adicionar (R$)</label>
                <input type="number" id="addAmount" placeholder="100" min="0.01" step="0.01" required
                    class="w-full px-4 py-3 rounded-xl border border-border dark:border-dark-border bg-[#fafafa] dark:bg-dark-background focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition">
            </div>
            <div class="flex gap-3">
                <button type="button" onclick="closeAddModal()" class="flex-1 py-3.5 rounded-xl border border-border dark:border-dark-border font-semibold hover:bg-gray-50 dark:hover:bg-dark-background transition">
                    Cancelar
                </button>
                <button type="submit" class="flex-1 py-3.5 rounded-xl bg-primary hover:bg-primary-hover font-bold transition shadow-md shadow-yellow-200/50">
                    Adicionar
                </button>
            </div>
        </form>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ============ Ícones ============
    lucide.createIcons();

    // ============ Tema (Dark Mode) ============
    const themeToggle = document.getElementById('theme-toggle');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');
    const lightIcon = document.getElementById('theme-toggle-light-icon');

    function updateThemeIcons() {
        const isDark = document.documentElement.classList.contains('dark');
        darkIcon.classList.toggle('hidden', isDark);
        lightIcon.classList.toggle('hidden', !isDark);
    }

    // Carrega tema salvo
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    }
    updateThemeIcons();

    themeToggle?.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        updateThemeIcons();
        lucide.createIcons();
    });

    // ============ Sidebar collapse ============
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('main-content');

    function setSidebarState(isCollapsed) {
        if (!sidebar || !mainContent) return;
        sidebar.classList.toggle('sidebar-collapsed', isCollapsed);
        mainContent.style.marginLeft = '290px';
    }

    if (sidebar && mainContent) {
        /* mouseleave collapse disabled */
        /* mouseenter expand disabled */
        setSidebarState(false);
    }

    // ============ Banco de dados local ============
    const STORAGE_KEY = 'vaultledger_goals_v1';

    function loadGoals() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch (e) {
            console.error('Erro ao carregar metas:', e);
            return [];
        }
    }

    function saveGoals(goals) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(goals));
    }

    let goals = loadGoals();

    // ============ Utilitários ============
    function formatMoney(value) {
        return value.toLocaleString('pt-BR', {
            style: 'currency',
            currency: 'BRL',
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        });
    }

    function formatMoneyFull(value) {
        return value.toLocaleString('pt-BR', {
            style: 'currency',
            currency: 'BRL',
            minimumFractionDigits: 2
        });
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function getCategoryInfo(cat) {
        const map = {
            travel: { label: 'VIAGEM', color: 'bg-purple-500', bg: 'bg-purple-50 dark:bg-purple-900/30', text: 'text-purple-600 dark:text-purple-400' },
            tech:   { label: 'TECH',   color: 'bg-blue-500',   bg: 'bg-blue-50 dark:bg-blue-900/30',     text: 'text-blue-600 dark:text-blue-400' },
            safety: { label: 'SEGURANÇA', color: 'bg-emerald-500', bg: 'bg-emerald-50 dark:bg-emerald-900/30', text: 'text-emerald-600 dark:text-emerald-400' },
            other:  { label: 'OUTRO',  color: 'bg-gray-400',   bg: 'bg-gray-100 dark:bg-gray-800',       text: 'text-gray-600 dark:text-gray-400' }
        };
        return map[cat] || map.other;
    }

    function getCategoryIcon(cat) {
        if (cat === 'travel') return 'plane';
        if (cat === 'tech') return 'laptop';
        if (cat === 'safety') return 'shield';
        return 'target';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ============ Render ============
    function renderGoals() {
        const grid = document.getElementById('goalsGrid');

        if (goals.length === 0) {
            grid.innerHTML = `
                <div class="col-span-full bg-white dark:bg-dark-card dark:border-dark-border rounded-[32px] border border-border p-14 text-center shadow-sm">
                    <div class="w-20 h-20 bg-[#fef9e7] dark:bg-yellow-900/20 rounded-[28px] flex items-center justify-center mx-auto mb-6 text-[#c7a600]">
                        <i data-lucide="target" class="w-10 h-10"></i>
                    </div>
                    <h3 class="text-2xl md:text-3xl font-black mb-3 text-text-main dark:text-dark-text-main">
                        Nenhuma meta ainda
                    </h3>
                    <p class="text-text-muted max-w-md mx-auto leading-relaxed mb-8">
                        Clique em “Criar Meta” para começar a planejar seus objetivos financeiros.
                    </p>
                    <button onclick="openCreateModal()" class="bg-primary hover:bg-primary-hover transition px-8 py-4 rounded-2xl font-bold shadow-lg shadow-yellow-100 dark:shadow-none">
                        + Criar Meta
                    </button>
                </div>
            `;
            lucide.createIcons();
            return;
        }

        grid.innerHTML = goals.map(goal => {
            const info = getCategoryInfo(goal.category);
            const current = Number(goal.current) || 0;
            const target = Number(goal.target) || 1;
            const pct = Math.min(100, Math.round((current / target) * 100));
            const remaining = Math.max(0, target - current);
            const isComplete = current >= target;
            const iconName = getCategoryIcon(goal.category);

            return `
                <article class="relative bg-white dark:bg-dark-card dark:border-dark-border rounded-[28px] border border-border p-7 shadow-sm card-hover flex flex-col">
                    <button class="btn-delete" title="Excluir meta" onclick="deleteGoal('${goal.id}')">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>

                    <span class="absolute top-5 right-6 text-[11px] font-bold tracking-widest uppercase text-text-muted">
                        ${info.label}
                    </span>

                    <div class="w-12 h-12 rounded-2xl ${info.bg} ${info.text} flex items-center justify-center mb-5 mt-2">
                        <i data-lucide="${iconName}" class="w-6 h-6"></i>
                    </div>

                    <h3 class="text-xl font-bold tracking-tight mb-1">${escapeHtml(goal.name)}</h3>
                    <div class="text-2xl font-black tracking-tight mb-1">
                        ${formatMoney(current)}
                        <span class="text-base font-medium text-text-muted">de ${formatMoney(target)}</span>
                    </div>
                    ${goal.description ? `<p class="text-sm text-text-muted mb-4 line-clamp-2">${escapeHtml(goal.description)}</p>` : '<div class="mb-4"></div>'}

                    <div class="progress-track mb-2.5">
                        <div class="progress-fill ${info.color}" style="width: ${pct}%"></div>
                    </div>
                    <div class="flex justify-between text-xs font-semibold text-text-muted mb-5">
                        <span>${pct}% COMPLETO</span>
                        <span>${isComplete ? 'Meta atingida! 🎉' : formatMoney(remaining) + ' RESTANTE'}</span>
                    </div>

                    <button onclick="openAddModal('${goal.id}')" 
                        class="mt-auto w-full py-3 rounded-xl border border-border dark:border-dark-border bg-[#fafafa] dark:bg-dark-background font-semibold text-sm hover:bg-gray-100 dark:hover:bg-[#2a2a2a] transition ${isComplete ? 'opacity-50 cursor-not-allowed' : ''}"
                        ${isComplete ? 'disabled' : ''}>
                        + Adicionar Valor
                    </button>
                </article>
            `;
        }).join('');

        lucide.createIcons();
    }

    // ============ Criar Meta ============
    function openCreateModal() {
        document.getElementById('createForm').reset();
        document.getElementById('createModal').classList.add('open');
        setTimeout(() => document.getElementById('goalName').focus(), 100);
    }

    function closeCreateModal() {
        document.getElementById('createModal').classList.remove('open');
    }

    function handleCreate(e) {
        e.preventDefault();
        const name = document.getElementById('goalName').value.trim();
        const description = document.getElementById('goalDesc').value.trim();
        const target = parseFloat(document.getElementById('goalTarget').value);
        const category = document.getElementById('goalCategory').value;

        if (!name || !target || target <= 0) {
            showToast('Preencha os campos corretamente.');
            return;
        }

        const newGoal = {
            id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2),
            name,
            description,
            target,
            current: 0,
            category,
            createdAt: new Date().toISOString()
        };

        goals.unshift(newGoal);
        saveGoals(goals);
        renderGoals();
        closeCreateModal();
        showToast('Meta criada com sucesso!');
    }

    // ============ Adicionar Valor ============
    function openAddModal(id) {
        const goal = goals.find(g => g.id === id);
        if (!goal) return;

        document.getElementById('addGoalId').value = id;
        document.getElementById('addGoalName').value = goal.name;
        document.getElementById('addAmount').value = '';
        document.getElementById('addModal').classList.add('open');
        setTimeout(() => document.getElementById('addAmount').focus(), 100);
    }

    function closeAddModal() {
        document.getElementById('addModal').classList.remove('open');
    }

    function handleAddValue(e) {
        e.preventDefault();
        const id = document.getElementById('addGoalId').value;
        const amount = parseFloat(document.getElementById('addAmount').value);

        if (!amount || amount <= 0) {
            showToast('Informe um valor válido.');
            return;
        }

        const goal = goals.find(g => g.id === id);
        if (!goal) return;

        goal.current = Math.min(goal.target, (Number(goal.current) || 0) + amount);
        saveGoals(goals);
        renderGoals();
        closeAddModal();
        showToast(`+${formatMoneyFull(amount)} adicionados!`);
    }

    // ============ Excluir Meta ============
    function deleteGoal(id) {
        const goal = goals.find(g => g.id === id);
        if (!goal) return;

        if (!confirm(`Tem certeza que deseja excluir a meta "${goal.name}"?`)) return;

        goals = goals.filter(g => g.id !== id);
        saveGoals(goals);
        renderGoals();
        showToast('Meta excluída.');
    }

    // Fechar modais
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeCreateModal();
            closeAddModal();
        }
    });

    document.getElementById('createModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeCreateModal();
    });

    document.getElementById('addModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeAddModal();
    });

    // Logout simples
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
        if (confirm('Deseja sair do VaultLedger?')) {
            // Aqui você pode limpar sessão se tiver auth
            window.location.href = 'dashboard.html';
        }
    });

    // Inicialização
    renderGoals();
</script>

<script>
(function() {
  function pad(n){ return String(n).padStart(2,'0'); }
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function tomorrowStr() {
    const d = new Date();
    d.setDate(d.getDate()+1);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function formatBR(iso) {
    if (!iso) return '';
    const p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function formatMoney(v) {
    return Number(v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  }
  function protocolBlocked() {
    return location.protocol === 'file:';
  }

  function getDueAgendamentos() {
    let list = [];
    try { list = JSON.parse(localStorage.getItem('agendamentos')) || []; } catch(e) {}
    const t = todayStr();
    const tm = tomorrowStr();
    return list
      .filter(a => a && (a.data === t || a.data === tm))
      .map(a => ({
        ...a,
        when: a.data === t ? 'today' : 'tomorrow',
        label: a.data === t ? 'Hoje' : 'Amanhã'
      }))
      .sort((a,b) => String(a.data).localeCompare(String(b.data)));
  }

  function renderNotifUI() {
    const items = getDueAgendamentos();
    const badge = document.getElementById('vlNotifBadge');
    const list = document.getElementById('vlNotifList');
    if (!badge || !list) return;

    if (items.length === 0) {
      badge.classList.remove('show');
      badge.textContent = '0';
      list.innerHTML = '<div class="vl-notif-empty">Nenhum agendamento para hoje ou amanhã.</div>';
    } else {
      badge.classList.add('show');
      badge.textContent = String(items.length);
      list.innerHTML = items.map(a => {
        const nome = String(a.nome || 'Agendamento').replace(/</g,'&lt;');
        const desc = a.descricao ? '<p class="text-xs text-text-muted mt-1 truncate">' + String(a.descricao).replace(/</g,'&lt;') + '</p>' : '';
        return '<div class="vl-notif-item">' +
          '<div class="vl-notif-dot ' + a.when + '"></div>' +
          '<div class="min-w-0 flex-1">' +
            '<p class="font-bold text-sm text-text-main dark:text-dark-text-main truncate">' + nome + '</p>' +
            '<p class="text-xs text-text-muted mt-0.5">' + a.label + ' · ' + formatBR(a.data) + ' · ' + formatMoney(a.valor) + '</p>' +
            desc +
          '</div>' +
          '<span class="text-[10px] font-black uppercase tracking-wider ' + (a.when==='today'?'text-red-500':'text-yellow-600') + '">' + a.label + '</span>' +
        '</div>';
      }).join('');
    }
  }

  function showToast(msg, isError) {
    let t = document.getElementById('vlNotifToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'vlNotifToast';
      t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;padding:14px 22px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:90vw;text-align:center;transition:opacity .3s;pointer-events:none;';
      document.body.appendChild(t);
    }
    t.style.background = isError ? '#991b1b' : '#111827';
    t.style.color = '#fff';
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.style.opacity = '0'; }, 4500);
  }

  function fireNotification(title, body, tag) {
    try {
      const n = new Notification(title, {
        body: body,
        tag: tag || ('vl-' + Date.now()),
        icon: 'vaultledger_logo.png',
        badge: 'vaultledger_logo.png',
        requireInteraction: false
      });
      n.onclick = function() {
        window.focus();
        n.close();
        try { location.href = 'agenda.html'; } catch(e) {}
      };
      return true;
    } catch (err) {
      console.error('Notification error:', err);
      return false;
    }
  }

  function sendDueNotifications(silent) {
    if (protocolBlocked()) {
      if (!silent) showToast('Abra o site via localhost (Live Server) para notificações no PC.', true);
      return 0;
    }
    if (!('Notification' in window) || Notification.permission !== 'granted') return 0;

    const items = getDueAgendamentos();
    if (!items.length) return 0;

    // Evita spam: só uma vez por dia por agendamento
    const dayKey = 'vl_auto_notif_' + todayStr();
    let sentMap = {};
    try { sentMap = JSON.parse(localStorage.getItem(dayKey) || '{}'); } catch(e) {}

    let ok = 0;
    items.forEach(function(a) {
      const id = String(a.id);
      if (sentMap[id]) return;
      const title = (a.when === 'today' ? 'Agendamento HOJE: ' : 'Agendamento AMANHÃ: ') + (a.nome || 'Pagamento');
      const body = formatBR(a.data) + ' · ' + formatMoney(a.valor) + (a.descricao ? '\n' + a.descricao : '');
      if (fireNotification(title, body, 'vl-agenda-' + id)) {
        sentMap[id] = 1;
        ok++;
      }
    });

    try { localStorage.setItem(dayKey, JSON.stringify(sentMap)); } catch(e) {}
    return ok;
  }

  async function ensurePermissionAndNotify() {
    if (protocolBlocked()) {
      // Só avisa uma vez por sessão
      if (!sessionStorage.getItem('vl_file_warn')) {
        sessionStorage.setItem('vl_file_warn', '1');
        // não spammar toast em file://
      }
      renderNotifUI();
      return;
    }

    if (!('Notification' in window)) {
      renderNotifUI();
      return;
    }

    let permission = Notification.permission;

    // Primeira visita: pedir permissão automaticamente
    if (permission === 'default') {
      try {
        permission = await Notification.requestPermission();
      } catch (e) {
        console.warn('requestPermission failed', e);
      }
    }

    if (permission === 'granted') {
      const n = sendDueNotifications(true);
      if (n > 0 && !sessionStorage.getItem('vl_toast_sent_' + todayStr())) {
        sessionStorage.setItem('vl_toast_sent_' + todayStr(), '1');
        showToast(n + ' agendamento(s) notificado(s) no sistema.');
      }
    }

    renderNotifUI();
  }

  // Botão manual ainda funciona (reenvia / força)
  async function sendSystemNotificationsManual() {
    if (protocolBlocked()) {
      showToast('Notificações do PC não funcionam em file://. Use Live Server (localhost).', true);
      return;
    }
    if (!('Notification' in window)) {
      showToast('Navegador sem suporte a notificações.', true);
      return;
    }

    let permission = Notification.permission;
    if (permission === 'default') {
      try { permission = await Notification.requestPermission(); } catch(e) {}
    }
    if (permission !== 'granted') {
      showToast('Permissão negada. Ative no cadeado da barra de endereço.', true);
      return;
    }

    // Limpa mapa do dia para permitir reenvio manual
    try { localStorage.removeItem('vl_auto_notif_' + todayStr()); } catch(e) {}
    const n = sendDueNotifications(false);
    if (n > 0) showToast(n + ' notificação(ões) enviada(s).');
    else {
      const items = getDueAgendamentos();
      if (!items.length) showToast('Nenhum agendamento para hoje ou amanhã.');
      else showToast('Notificações já tinham sido enviadas hoje. Reenviado se necessário.');
      // force fire anyway on manual
      items.forEach(function(a) {
        const title = (a.when === 'today' ? 'Agendamento HOJE: ' : 'Agendamento AMANHÃ: ') + (a.nome || 'Pagamento');
        const body = formatBR(a.data) + ' · ' + formatMoney(a.valor);
        fireNotification(title, body, 'vl-agenda-manual-' + a.id + '-' + Date.now());
      });
      if (items.length) showToast(items.length + ' notificação(ões) reenviada(s).');
    }
  }

  function initBell() {
    const btn = document.getElementById('vlNotifBtn');
    const panel = document.getElementById('vlNotifPanel');
    const sysBtn = document.getElementById('vlNotifSysBtn');
    if (!btn || !panel) return;

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      panel.classList.toggle('open');
      renderNotifUI();
      if (window.lucide) try { lucide.createIcons(); } catch(e) {}
    });
    document.addEventListener('click', function(e) {
      if (!panel.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
        panel.classList.remove('open');
      }
    });
    if (sysBtn) {
      sysBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        sendSystemNotificationsManual();
      });
    }

    renderNotifUI();

    // Pedir permissão + notificar automaticamente ao entrar
    setTimeout(function() {
      ensurePermissionAndNotify();
    }, 600);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initBell);
  } else {
    initBell();
  }
})();
</script>
